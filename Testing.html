<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengiraan Harga</title>
    <meta name="theme-color" content="#1E3A8A">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Pengiraan">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
body {
    font-family: sans-serif;
    font-size: 14px;
    background-color: #F0F9FF;
    padding: 20px;
}

h1 {
    text-align: center;
    color: #000000;
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 20px;
}
.form-row {
    display: flex;
    align-items: center;
    margin-bottom: 10px;
    gap: 10px;
    text-transform: uppercase;
}


.container {
    /* max-width: 400px; */
    margin:  auto;
    padding: 20px;
    background-color: #1E3A8A;
    border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
    color: white;
}

label {
    width: 120px;
    flex-shrink: 0;
    font-size: 14px;
    font-weight: 600;
}

input, select {
    width: 100%;
    padding: 8px;
    border: 1px solid #ccc;
    background-color: #F5F5F5;
    border-radius: 8px;
    font-size: 14px;
    box-sizing: border-box;
}

input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0;
}

input[type="number"] {
    -moz-appearance: textfield;
    appearance: textfield;
}


.btn-grad {
  background-image: linear-gradient(to right, #00d2ff 0%, #3a7bd5 51%, #00d2ff 100%);
  margin: 20px 0 0px auto;
  padding: 15px 45px;
  text-align: center;
  text-transform: uppercase;
  font-weight: bold;
  transition: 0.5s;
  background-size: 200% auto;
  color: black;
  box-shadow: 0 0 20px #221e1e1b;
  border-radius: 10px;
  display: block;
  outline: none;
  border: none;
  cursor: pointer;
}

.btn-grad:hover {
  background-position: right center;
  color: #000000;
  font-weight: bold;
}

.table-scroll-wrapper {
    width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    margin-top: 20px;
    border-radius: 10px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
}

table {
    width: 100%;
    min-width: 600px;
    border-collapse: separate;
    border-spacing: 0;
    border-radius: 10px;
    overflow: hidden;
}

#seksyen-modal table,
#print-area.seksyen-modal table {
    min-width: unset;
}

/* table, th, td {
    border: 1px solid #000000;
} */

#seksyen-harga table td:nth-child(1),
#print-area.seksyen-harga table td:nth-child(1) {
    text-transform: capitalize;
}

th, td {
    padding: 8px 12px;
    text-align: left;
    font-size: 14px;
}

td:nth-child(5),
#jumlahTotal {
    white-space: nowrap;
}

th {
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    white-space: nowrap;
}

th {
    background-color: #1E3A8A;
    color: white;
}

tbody tr:nth-child(odd) {
    background-color: #e2e8f0;
}

tbody tr:nth-child(even) {
    background-color: #f1f5f9;
}

.total-row td {
    font-weight: 700;
    font-size: 14px;
    background-color: #1E3A8A;
    color: white;
    padding: 10px 12px;
}

.bolak, .balik {
    background-color: #578FCA;
    text-align: center;
    color: white;
}
.btn-clear {
    background-image: linear-gradient(to right, #870000 0%, #190A05 51%, #870000 100%);
    margin: 10px 0;
    padding: 15px 24px;
    text-align: center;
    text-transform: uppercase;
    transition: 0.5s;
    background-size: 200% auto;
    color: white;
    font-weight: bold;
    box-shadow: 0 0 20px #eee;
    border-radius: 10px;
    display: block;
    outline: none;
    border: none;
    cursor: pointer;
    margin-left: auto;

}

.btn-clear:hover {
    background-position: right center;
    color: #fff;
    text-decoration: none;
}

.btn-edit, .btn-delete, .btn-save, .btn-cancel {
    width: 28px;
    height: 28px;
    border: none;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    margin-right: 4px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}

.btn-edit {
    background-color: #4E71FF;
    color: white;
}

.btn-delete {
    background-color: #870000;
    color: white;
}

.btn-save {
    background-color: #22C55E;
    color: white;
}

.btn-cancel {
    background-color: #94A3B8;
    color: white;
}

.inline-input {
    width: 100%;
    padding: 4px 6px;
    border: 1.5px solid #4E71FF;
    border-radius: 4px;
    font-size: 14px;
    font-family: sans-serif;
    box-sizing: border-box;
}

.section-divider {
    position: relative;
    margin: 48px 0 40px;
    height: 64px;
    overflow: hidden;
}

.section-divider::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 0;
    right: 0;
    height: 2px;
    background-color: #CBD5E1;
    transform: translateY(-50%);
}

.tractor-icon {
    height: 68px;
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    animation: driveAcross 5s linear infinite;
}

.tractor-icon:hover {
    animation-play-state: paused;
    cursor: pointer;
}

@keyframes driveAcross {
    from { right: -64px; }
    to   { right: 100%; }
}


.page-wrap {
    max-width: 800px;
    margin: 0 auto;
}

@media (min-width: 600px) {
    body {
        padding: 28px 32px;
    }
    label {
        width: 140px;
    }
}

@media (min-width: 900px) {
    body {
        padding: 40px;
    }
}

#print-area { display: none; }

@page {
    size: A4 portrait;
    margin: 15mm 12mm;
}

@media print {
    body > *:not(#print-area) { display: none !important; }
    #print-area { display: block !important; }

    /* Sembunyikan elemen interaktif & hiasan */
    .container,
    .btn-grad,
    .btn-clear,
    .btn-edit,
    .btn-delete,
    .btn-save,
    .btn-cancel,
    .section-divider,
    #customConfirm,
    #customAlert,
    br {
        display: none !important;
    }


    body {
        background: white;
        padding: 0;
        margin: 0;
        font-size: 11px;
        color: black;
    }

    tfoot {
        display: table-row-group;
    }

    h1 {
        font-size: 16px;
        font-weight: 700;
        margin: 0 0 10px 0;
        color: black;
        text-align: left;
    }

    /* Table: hitam putih, lebar penuh A4 */
    .table-scroll-wrapper {
        border-radius: 0;
        box-shadow: none;
        overflow: visible;
        margin-top: 4px;
    }

    table {
        width: calc(100% - 1px);
        border-collapse: separate;
        border-spacing: 0;
        border-left: 1px solid #555;
        border-top: 1px solid #555;
        border-right: none;
        border-bottom: none;
        box-shadow: none;
        border-radius: 0;
        margin-top: 0;
        table-layout: fixed;
        background: white;
    }

    th, td {
        border-right: 1px solid #555;
        border-bottom: 1px solid #555;
        border-left: none;
        border-top: none;
        padding: 5px 7px;
        font-size: 11px;
        color: black;
        background: white !important;
        word-wrap: break-word;
        overflow-wrap: break-word;
        white-space: normal;
    }

    th {
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0;
    }

    /* Hilangkan warna baris selang-seli */
    tbody tr:nth-child(odd),
    tbody tr:nth-child(even) {
        background: white !important;
    }

    /* Row header BOLAK/BALIK */
    .bolak, .balik {
        background: #e8e8e8 !important;
        color: black !important;
        font-weight: 700;
        text-align: center;
    }

    /* Row jumlah - bold border atas je */
    .total-row td {
        background: white !important;
        color: black !important;
        font-weight: 700;
        font-size: 11px;
        padding: 5px 7px;
        border-top: 2px solid #333;
    }

    /* Jangan potong baris di tengah halaman */
    tr { page-break-inside: avoid; break-inside: avoid; }

    #seksyen-harga table th:nth-child(1), #seksyen-harga table td:nth-child(1),
    #print-area.seksyen-harga table th:nth-child(1), #print-area.seksyen-harga table td:nth-child(1) { width: 20%; }

    #seksyen-harga table th:nth-child(2), #seksyen-harga table td:nth-child(2),
    #print-area.seksyen-harga table th:nth-child(2), #print-area.seksyen-harga table td:nth-child(2) { width: 10%; }

    #seksyen-harga table th:nth-child(3), #seksyen-harga table td:nth-child(3),
    #print-area.seksyen-harga table th:nth-child(3), #print-area.seksyen-harga table td:nth-child(3) { width: 38%; }

    #seksyen-harga table th:nth-child(4), #seksyen-harga table td:nth-child(4),
    #print-area.seksyen-harga table th:nth-child(4), #print-area.seksyen-harga table td:nth-child(4) { width: 16%; }

    #seksyen-harga table th:nth-child(5), #seksyen-harga table td:nth-child(5),
    #print-area.seksyen-harga table th:nth-child(5), #print-area.seksyen-harga table td:nth-child(5) { width: 16%; }

    #seksyen-modal table th:nth-child(1), #seksyen-modal table td:nth-child(1),
    #print-area.seksyen-modal table th:nth-child(1), #print-area.seksyen-modal table td:nth-child(1) { width: 70%; }

    #seksyen-modal table th:nth-child(2), #seksyen-modal table td:nth-child(2),
    #print-area.seksyen-modal table th:nth-child(2), #print-area.seksyen-modal table td:nth-child(2) { width: 30%; }
}

</style>

</head>
<body>
<div class="page-wrap">
    <div id="seksyen-harga">
    <h1>Pengiraan Harga</h1>

    <div class="container">
        <div class="form-row">
            <label for="jenisKadar">Jenis Kadar</label>
            <select id="jenisKadar" name="jenisKadar" onchange="handleJenisKadar(this.value)">
                <option value="">-- Pilih jenis kadar --</option>
                <option value="bolak">Bolak</option>
                <option value="balik">Balik</option>
            </select>
        </div>

        <div id="kadarBolakGroup" style="display: none;">
            <div class="form-row">
                <label for="kadarBolak">Kadar Bolak</label>
                <input type="number" id="kadarBolak" step="0.01">
            </div>
        </div>

        <div id="kadarBalikGroup" style="display: none;">
            <div class="form-row">
                <label for="kadarBalik">Kadar Balik</label>
                <input type="number" id="kadarBalik" step="0.01">
            </div>
        </div>

        <form id="priceForm" novalidate>
            <div class="form-row">
                <label for="nama">Nama</label>
                <input type="text" id="nama" name="nama" required>
            </div>

            <div class="form-row">
                <label for="quantity">Kuantiti</label>
                <input type="number" id="quantity" name="quantity" step="any" required>
            </div>

            <div class="form-row">
                <label for="catatan">Catatan</label>
                <input type="text" id="catatan" name="catatan">
            </div>

            <button type="submit" class="btn-grad" style="margin-top: 12px;">Tambah</button>
        </form>
    </div>

    <br>
    <button class="btn-clear" onclick="clearPriceTable()">Padam Semua</button>
    <div class="table-scroll-wrapper">
    <table>
        <thead>
            <tr>
                <th>Nama</th>
                <th>Kuantiti</th>
                <th>Catatan</th>
                <th>Kadar</th>
                <th>Jumlah</th>
                <th>Lain-lain</th>
            </tr>
        </thead>
        <tbody id="priceTableBody">
            <tr>
                <td colspan="6" class="bolak">BOLAK</td>
            </tr>
            <tr id="balikHeaderRow">
                <td colspan="6" class="balik">BALIK</td>
            </tr>
        </tbody>
        <tfoot>
            <tr class="total-row">
                <td>Jumlah</td>
                <td id="kuantitiTotal">0</td>
                <td colspan="2"></td>
                <td id="jumlahTotal">RM 0.00</td>
                <td></td>
            </tr>
        </tfoot>
    </table>
    </div>

    <br>
    <button class="btn-grad" onclick="printHarga()">Cetak ke PDF</button>
    </div>

        function handleJenisKadar(val) {
            document.getElementById('kadarBolakGroup').style.display = val === 'bolak' ? 'block' : 'none';
            document.getElementById('kadarBalikGroup').style.display = val === 'balik' ? 'block' : 'none';
        }

        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('input[type="number"]').forEach(function(input) {
                input.addEventListener('keydown', function(e) {
                    if (['e', 'E', '+', '-'].includes(e.key)) e.preventDefault();
                });
            });

        });

        function showAlert(msg) {
            document.getElementById('customAlertMsg').textContent = msg;
            document.getElementById('customAlert').style.display = 'flex';
        }

        function updateTotal() {
            const rows = document.querySelectorAll('#priceTableBody tr');
            let total = 0;
            let totalKuantiti = 0;
            rows.forEach(function(row) {
                const cells = row.querySelectorAll('td');
                if (cells.length === 6) {
                    const qty = parseFloat(cells[1].textContent);
                    if (!isNaN(qty)) totalKuantiti += qty;
                    const val = parseFloat(cells[4].textContent.replace('RM ', ''));
                    if (!isNaN(val)) total += val;
                }
            });
            document.getElementById('kuantitiTotal').textContent = totalKuantiti % 1 === 0 ? totalKuantiti : totalKuantiti.toFixed(2);
            document.getElementById('jumlahTotal').textContent = 'RM ' + total.toFixed(2);
            saveToStorage();
        }

        function addActionButtons(row) {
            const actionCell = document.createElement('td');

            const editBtn = document.createElement('button');
            editBtn.innerHTML = '✎';
            editBtn.className = 'btn-edit';
            editBtn.title = 'Edit';
            editBtn.onclick = function() { makeRowEditable(row); };

            const deleteBtn = document.createElement('button');
            deleteBtn.innerHTML = '✖';
            deleteBtn.className = 'btn-delete';
            deleteBtn.title = 'Padam';
            deleteBtn.onclick = function() { row.remove(); updateTotal(); };

            actionCell.appendChild(editBtn);
            actionCell.appendChild(deleteBtn);
            row.appendChild(actionCell);
        }

        function makeRowEditable(row) {
            const cells = row.querySelectorAll('td');
            const editableIndexes = [0, 1, 2, 3];
            const originalValues = {};

            editableIndexes.forEach(function(i) {
                originalValues[i] = cells[i].textContent;
                const input = document.createElement('input');
                input.value = cells[i].textContent;
                input.className = 'inline-input';
                cells[i].textContent = '';
                cells[i].appendChild(input);
            });

            // Jumlah — strip "RM " so user edits just the number
            originalValues[4] = cells[4].textContent;
            const jumlahInput = document.createElement('input');
            jumlahInput.value = cells[4].textContent.replace('RM ', '');
            jumlahInput.className = 'inline-input';
            jumlahInput.type = 'number';
            jumlahInput.step = '0.01';
            cells[4].textContent = '';
            cells[4].appendChild(jumlahInput);

            const actionCell = cells[5];
            actionCell.innerHTML = '';

            const saveBtn = document.createElement('button');
            saveBtn.innerHTML = '✔';
            saveBtn.className = 'btn-save';
            saveBtn.title = 'Simpan';
            saveBtn.onclick = function() {
                editableIndexes.forEach(function(i) {
                    cells[i].textContent = cells[i].querySelector('input').value;
                });
                const jumlahVal = parseFloat(cells[4].querySelector('input').value);
                cells[4].textContent = 'RM ' + jumlahVal.toFixed(2);
                restoreActionButtons(row);
                updateTotal();
            };

            const cancelBtn = document.createElement('button');
            cancelBtn.innerHTML = '🗙';
            cancelBtn.className = 'btn-cancel';
            cancelBtn.title = 'Batal';
            cancelBtn.onclick = function() {
                editableIndexes.forEach(function(i) {
                    cells[i].textContent = originalValues[i];
                });
                cells[4].textContent = originalValues[4];
                restoreActionButtons(row);
            };

            actionCell.appendChild(saveBtn);
            actionCell.appendChild(cancelBtn);
        }

        function restoreActionButtons(row) {
            const actionCell = row.querySelector('td:last-child');
            actionCell.innerHTML = '';

            const editBtn = document.createElement('button');
            editBtn.innerHTML = '✎';
            editBtn.className = 'btn-edit';
            editBtn.title = 'Edit';
            editBtn.onclick = function() { makeRowEditable(row); };

            const deleteBtn = document.createElement('button');
            deleteBtn.innerHTML = '✖';
            deleteBtn.className = 'btn-delete';
            deleteBtn.title = 'Padam';
            deleteBtn.onclick = function() { row.remove(); updateTotal(); };

            actionCell.appendChild(editBtn);
            actionCell.appendChild(deleteBtn);
        }

        document.getElementById('priceForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const nama = document.getElementById('nama').value;
            const quantity = parseFloat(document.getElementById('quantity').value);
            const catatan = document.getElementById('catatan').value;
            const jenisKadar = document.getElementById('jenisKadar').value;
            const kadarBolak = parseFloat(document.getElementById('kadarBolak').value);
            const kadarBalik = parseFloat(document.getElementById('kadarBalik').value);
            const kadar = jenisKadar === 'bolak' ? kadarBolak : kadarBalik;

            if (!nama) {
                showAlert('Sila lengkapkan bahagian Nama ya.');
                return;
            }

            if (!document.getElementById('quantity').value || isNaN(quantity)) {
                showAlert('Sila lengkapkan bahagian Kuantiti ya.');
                return;
            }

            if (jenisKadar === '') {
                showAlert('Kena pilih dulu ni kadar untuk bolak ke balik?');
                return;
            }

            if (isNaN(kadar)) {
                showAlert('Sila masukkan kadar ' + (jenisKadar === 'bolak' ? 'Bolak' : 'Balik') + ' terlebih dahulu.');
                return;
            }

            const totalPrice = quantity * kadar;
            const newRow = document.createElement('tr');

            [nama, quantity, catatan, kadar, 'RM ' + totalPrice.toFixed(2)].forEach(function(value) {
                const cell = document.createElement('td');
                cell.textContent = value;
                newRow.appendChild(cell);
            });

            addActionButtons(newRow);

            if (jenisKadar === 'bolak') {

                document.getElementById('balikHeaderRow').before(newRow);
            } else {
                document.getElementById('priceTableBody').appendChild(newRow);
            }

            document.getElementById('priceForm').reset();
            updateTotal();
        });
        // --- Pengiraan Modal ---

        function updateModalTotal() {
            const rows = document.querySelectorAll('#modalTableBody tr');
            let total = 0;
            rows.forEach(function(row) {
                const cells = row.querySelectorAll('td');
                if (cells.length === 3) {
                    const val = parseFloat(cells[1].textContent.replace('RM ', ''));
                    if (!isNaN(val)) total += val;
                }
            });
            document.getElementById('modalJumlahTotal').textContent = 'RM ' + total.toFixed(2);
            saveToStorage();
        }

        function addModalActionButtons(row) {
            const actionCell = document.createElement('td');

            const editBtn = document.createElement('button');
            editBtn.innerHTML = '✎';
            editBtn.className = 'btn-edit';
            editBtn.title = 'Edit';
            editBtn.onclick = function() { makeModalRowEditable(row); };

            const deleteBtn = document.createElement('button');
            deleteBtn.innerHTML = '✖';
            deleteBtn.className = 'btn-delete';
            deleteBtn.title = 'Padam';
            deleteBtn.onclick = function() { row.remove(); updateModalTotal(); };

            actionCell.appendChild(editBtn);
            actionCell.appendChild(deleteBtn);
            row.appendChild(actionCell);
        }

        function makeModalRowEditable(row) {
            const cells = row.querySelectorAll('td');
            const originalValues = { 0: cells[0].textContent, 1: cells[1].textContent };

            const perkaraInput = document.createElement('input');
            perkaraInput.value = cells[0].textContent;
            perkaraInput.className = 'inline-input';
            cells[0].textContent = '';
            cells[0].appendChild(perkaraInput);

            const hargaInput = document.createElement('input');
            hargaInput.value = cells[1].textContent.replace('RM ', '');
            hargaInput.className = 'inline-input';
            hargaInput.type = 'number';
            hargaInput.step = '0.01';
            cells[1].textContent = '';
            cells[1].appendChild(hargaInput);

            const actionCell = cells[2];
            actionCell.innerHTML = '';

            const saveBtn = document.createElement('button');
            saveBtn.innerHTML = '✔';
            saveBtn.className = 'btn-save';
            saveBtn.title = 'Simpan';
            saveBtn.onclick = function() {
                cells[0].textContent = cells[0].querySelector('input').value;
                const hargaVal = parseFloat(cells[1].querySelector('input').value);
                cells[1].textContent = 'RM ' + hargaVal.toFixed(2);
                restoreModalActionButtons(row);
                updateModalTotal();
            };

            const cancelBtn = document.createElement('button');
            cancelBtn.innerHTML = '🗙';
            cancelBtn.className = 'btn-cancel';
            cancelBtn.title = 'Batal';
            cancelBtn.onclick = function() {
                cells[0].textContent = originalValues[0];
                cells[1].textContent = originalValues[1];
                restoreModalActionButtons(row);
            };

            actionCell.appendChild(saveBtn);
            actionCell.appendChild(cancelBtn);
        }

        function restoreModalActionButtons(row) {
            const actionCell = row.querySelector('td:last-child');
            actionCell.innerHTML = '';

            const editBtn = document.createElement('button');
            editBtn.innerHTML = '✎';
            editBtn.className = 'btn-edit';
            editBtn.title = 'Edit';
            editBtn.onclick = function() { makeModalRowEditable(row); };

            const deleteBtn = document.createElement('button');
            deleteBtn.innerHTML = '✖';
            deleteBtn.className = 'btn-delete';
            deleteBtn.title = 'Padam';
            deleteBtn.onclick = function() { row.remove(); updateModalTotal(); };

            actionCell.appendChild(editBtn);
            actionCell.appendChild(deleteBtn);
        }

        document.getElementById('modalForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const perkara = document.getElementById('perkara').value;
            const harga = parseFloat(document.getElementById('harga').value);

            if (!perkara) {
                showAlert('Sila lengkapkan bahagian Perkara ya.');
                return;
            }

            if (!document.getElementById('harga').value || isNaN(harga)) {
                showAlert('Sila lengkapkan bahagian Harga ya.');
                return;
            }

            const newRow = document.createElement('tr');
            [perkara, 'RM ' + harga.toFixed(2)].forEach(function(value) {
                const cell = document.createElement('td');
                cell.textContent = value;
                newRow.appendChild(cell);
            });

            addModalActionButtons(newRow);
            document.getElementById('modalTableBody').appendChild(newRow);
            document.getElementById('modalForm').reset();
            updateModalTotal();
        });

        function saveToStorage() {
            const priceRows = [];
            let pastBalik = false;
            document.querySelectorAll('#priceTableBody tr').forEach(function(row) {
                if (row.id === 'balikHeaderRow') { pastBalik = true; return; }
                const cells = row.querySelectorAll('td');
                if (cells.length === 6) {
                    priceRows.push({
                        nama: cells[0].textContent,
                        kuantiti: cells[1].textContent,
                        catatan: cells[2].textContent,
                        kadar: cells[3].textContent,
                        jumlah: cells[4].textContent,
                        jenis: pastBalik ? 'balik' : 'bolak'
                    });
                }
            });

            const modalRows = [];
            document.querySelectorAll('#modalTableBody tr').forEach(function(row) {
                const cells = row.querySelectorAll('td');
                if (cells.length === 3) {
                    modalRows.push({ perkara: cells[0].textContent, harga: cells[1].textContent });
                }
            });

            try { localStorage.setItem('pengiraanHargaData', JSON.stringify({ priceRows, modalRows })); } catch(e) {}
        }

        function loadFromStorage() {
            let saved;
            try { saved = localStorage.getItem('pengiraanHargaData'); } catch(e) { return; }
            if (!saved) return;
            let data;
            try { data = JSON.parse(saved); } catch (e) { try { localStorage.removeItem('pengiraanHargaData'); } catch(e2) {} return; }

            if (data.priceRows) {
                const balikHeaderRow = document.getElementById('balikHeaderRow');
                data.priceRows.forEach(function(r) {
                    try {
                        const newRow = document.createElement('tr');
                        [r.nama, r.kuantiti, r.catatan, r.kadar, r.jumlah].forEach(function(value) {
                            const cell = document.createElement('td');
                            cell.textContent = value;
                            newRow.appendChild(cell);
                        });
                        addActionButtons(newRow);
                        if (r.jenis === 'bolak' && balikHeaderRow) {
                            balikHeaderRow.before(newRow);
                        } else {
                            document.getElementById('priceTableBody').appendChild(newRow);
                        }
                    } catch (e) {}
                });
                updateTotal();
            }

            if (data.modalRows) {
                data.modalRows.forEach(function(r) {
                    try {
                        const newRow = document.createElement('tr');
                        [r.perkara, r.harga].forEach(function(value) {
                            const cell = document.createElement('td');
                            cell.textContent = value;
                            newRow.appendChild(cell);
                        });
                        addModalActionButtons(newRow);
                        document.getElementById('modalTableBody').appendChild(newRow);
                    } catch (e) {}
                });
                updateModalTotal();
            }
        }

        var pendingClearAction = null;

        function showConfirm(action) {
            pendingClearAction = action;
            document.getElementById('customConfirm').style.display = 'flex';
        }

        document.getElementById('confirmPadamBtn').addEventListener('click', function() {
            document.getElementById('customConfirm').style.display = 'none';
            if (pendingClearAction) { pendingClearAction(); pendingClearAction = null; }
        });

        function clearPriceTable() {
            showConfirm(function() {
                const tbody = document.getElementById('priceTableBody');
                Array.from(tbody.querySelectorAll('tr')).forEach(function(row) {
                    if (row.id !== 'balikHeaderRow' && !row.querySelector('.bolak') && !row.querySelector('.balik')) row.remove();
                });
                updateTotal();
            });
        }

        function clearModalTable() {
            showConfirm(function() {
                document.getElementById('modalTableBody').innerHTML = '';
                updateModalTotal();
            });
        }

        loadFromStorage();

        function getTarikh() {
            const d = new Date();
            const day = String(d.getDate()).padStart(2, '0');
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const year = d.getFullYear();
            return day + '-' + month + '-' + year;
        }

        function showPdfError() {
            var el = document.getElementById('customAlertMsg');
            el.innerHTML = 'PDF tidak berjaya dicetak.<br><br>Sila pastikan anda mempunyai akses internet, atau gunakan <strong>Google Chrome</strong> / <strong>Safari</strong> / <strong>Microsoft Edge</strong>.';
            document.getElementById('customAlert').style.display = 'flex';
        }

        function doPrint(sectionId, title) {
            var asal = document.title;
            var printArea = document.getElementById('print-area');
            printArea.className = '';
            printArea.innerHTML = document.getElementById(sectionId).innerHTML;
            printArea.className = sectionId;

            printArea.querySelectorAll('th:last-child, td:last-child:not(.bolak):not(.balik)').forEach(function(el) {
                el.parentNode.removeChild(el);
            });
            printArea.querySelectorAll('td.bolak, td.balik').forEach(function(el) {
                var cs = parseInt(el.getAttribute('colspan'));
                if (cs > 1) el.setAttribute('colspan', cs - 1);
            });
            if (typeof window.print === 'function') {
                setTimeout(function() {
                    var dialogTriggered = false;
                    var checkTimer = setTimeout(function() {
                        if (!dialogTriggered) showPdfError();
                    }, 50);

                    window.addEventListener('beforeprint', function handler() {
                        dialogTriggered = true;
                        clearTimeout(checkTimer);
                        window.removeEventListener('beforeprint', handler);
                    });

                    document.title = title;
                    window.print();
                    document.title = asal;
                }, 300);
            } else {
                showPdfError();
            }
        }

        function printHarga() {
            doPrint('seksyen-harga', 'pengiraan_harga(' + getTarikh() + ')');
        }

        function printModal() {
            doPrint('seksyen-modal', 'pengiraan_modal(' + getTarikh() + ')');
        }
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('service-worker.js');
            });
        }
    </script>
